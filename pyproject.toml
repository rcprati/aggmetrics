[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aggmetrics"
version = "0.1.1"
description = "Aggregating classification performance measures for machine learning: indicator matrices and aggregation operators"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Ronaldo C. Prati", email = "ronaldo.prati@ufabc.edu.br" }]
keywords = [
  "machine learning", "classification", "evaluation", "performance measures", "metrics",
  "multilabel", "multiclass", "class imbalance", "confusion matrix",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.0"]
frame = ["pandas>=1.3"]
test = ["pytest>=7.0", "pytest-cov>=4.0", "scikit-learn>=1.0", "pandas>=1.3"]
examples = ["scikit-learn>=1.0", "pandas>=1.3", "matplotlib>=3.5"]
deep = ["torch", "keras>=3"]                # notebook 11 only
docs = ["sphinx>=7.0", "furo", "myst-nb>=1.0", "sphinx-copybutton"]
all = ["scikit-learn>=1.0", "pandas>=1.3"]

[project.urls]
Homepage = "https://github.com/rcprati/aggmetrics"
Repository = "https://github.com/rcprati/aggmetrics"
Documentation = "https://aggmetrics.readthedocs.io"
Issues = "https://github.com/rcprati/aggmetrics/issues"

[tool.setuptools.packages.find]
include = ["aggmetrics*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# the tests keep one-line setup statements and long assertion messages
"tests/*" = ["E501", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["aggmetrics"]

[tool.coverage.report]
fail_under = 100
show_missing = true
