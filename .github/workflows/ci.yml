name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Check the theorem suite specifically
        run: python -m pytest tests/test_theory.py -q
      - name: Doctests
        run: python -m pytest --doctest-modules aggmetrics -q
      - name: Coverage (lines and branches must stay at 100%)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: python -m pytest --cov=aggmetrics --cov-report=term-missing -q
      - name: Execute the offline example notebooks
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m pip install nbmake matplotlib
          python -m pytest --nbmake examples/notebooks/01_floor_trap.ipynb examples/notebooks/02_micro_macro_imbalance.ipynb -q
      - name: Cache the OpenML data used by the multilabel notebook
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: openml-yeast-v4
      # This notebook downloads data from OpenML, which is not always reachable from the
      # runner, so a failure is reported without blocking the build.
      - name: Execute the notebook that downloads data (non-blocking)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        continue-on-error: true
        timeout-minutes: 15
        run: python -m pytest --nbmake --nbmake-timeout=600 examples/notebooks/03_multilabel_ranking.ipynb -q
      - name: Build the documentation (warnings are errors)
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.12'
        run: |
          python -m pip install ".[docs]"
          python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Run the worked examples
        shell: bash
        run: python examples/quickstart.py > /dev/null
      - name: Run the agent skill example
        shell: bash
        run: |
          python .agents/skills/aggmetrics-guide/examples/agent_session_example.py > /dev/null
          python .agents/skills/aggmetrics-guide/examples/quickstart_recipes.py > /dev/null
